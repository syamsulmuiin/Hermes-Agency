# Optional production acceptance candidate; NOT automatically installed.
# SQLite DELETE journaling needs write access to the containing directory
# for BEGIN IMMEDIATE and its rollback journal. The broker must preserve
# the trusted lease transaction lock throughout fixed-job execution.
#
# This is a deliberate privilege expansion: the root broker can write the
# trusted database directory. Keep the keys directory inaccessible in its
# mount namespace, and do not deploy before explicit operator review.
# Do not change ownership or permissions of agency.db or its parent.
[Service]
ReadWritePaths=/var/lib/hermes-agency
InaccessiblePaths=/var/lib/hermes-agency/keys
