# NOT INSTALLED. Reference-only broker lifecycle drop-in.
# Install only after isolated crash acceptance and deployment path verification.
# Intended destination: hermes-signed-broker.service.d/20-fenced-recovery.conf
#
# ExecStartPre gates EVERY broker startup on independent recovery success.
# ExecStopPost also runs after broker startup failure or main-process crash.
# The broker must not be concurrently launched outside this systemd unit.
#
# This alone is NOT sufficient to prove crash safety: list-units may omit
# unloaded transient units; independently launched brokers bypass this gate;
# and a broker crash may release the trusted SQLite fence before recovery
# completes. A durable unit ownership registry and systemd lifetime coupling
# are required before production activation.
[Service]
ExecStartPre=/usr/bin/python3 -m agency.fenced_unit_recovery --broker-stopped --journal /var/lib/hermes-broker/fenced-owned.sqlite
ExecStopPost=/usr/bin/python3 -m agency.fenced_unit_recovery --broker-stopped --journal /var/lib/hermes-broker/fenced-owned.sqlite
